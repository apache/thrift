#
# Packages the Windows Thrift compiler for Chocolatey, so that it can be
# installed with "choco install thrift".
#
# The package downloads the installer from archive.apache.org rather than
# carrying a copy, so it cannot be built until the release has been promoted
# and the archive has picked it up. If the release run is too early, re-run it
# once the archive has the file, or start this workflow from the Actions tab
# with the version.
#
# An installer the release vote did not cover is not on dist.apache.org, and
# so not in the archive either. For such a release, start this workflow from
# the Actions tab with installer_source set to github: the package then
# downloads the copy on the GitHub release. See doc/ReleaseManagement.md.
#
# Nothing is pushed unless the CHOCO_API_KEY secret is set, to the API key of
# an account that maintains the "thrift" package on the Chocolatey community
# repository. See doc/ReleaseManagement.md.

name: "Chocolatey"

on:
  release:
    types: [published]
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/chocolatey.yml"
      - "build/windows/chocolatey/**"
      - "build/windows/build-chocolatey-package.ps1"
      - "doc/ReleaseManagement.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to package, for example 0.26.0. Taken from CMakeLists.txt when empty."
        required: false
        type: string
      installer_source:
        description: "Where the package downloads the installer from: archive (archive.apache.org) when the release vote covered the installer, github (the copy on the GitHub release) when it did not."
        required: false
        type: choice
        options:
          - archive
          - github
        default: archive

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package
    # choco pack needs Chocolatey, which is only on the Windows images.
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the package builder
        shell: pwsh
        run: ./build/windows/chocolatey/test-chocolatey-package.ps1

      - name: Determine the version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = ''
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          }
          elseif ($env:RELEASE_TAG) {
            $version = $env:RELEASE_TAG -replace '^v', ''
          }
          else {
            foreach ($line in Get-Content CMakeLists.txt) {
              if ($line -match '^\s*set\(thrift_VERSION\s+"(\d+\.\d+\.\d+)"\)') {
                $version = $Matches[1]
                break
              }
            }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Could not determine a major.minor.patch version (got '$version')."
            exit 1
          }

          Write-Host "Version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_SOURCE: ${{ inputs.installer_source }}
          # A release and a manual run both push, so only a pull request
          # packages a placeholder.
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          # Only a manual run has inputs. A release run uses the archive.
          $source = if ($env:INSTALLER_SOURCE) { $env:INSTALLER_SOURCE } else { 'archive' }
          Write-Host "Installer source: $source"

          if ($env:IS_PULL_REQUEST -ne 'true') {
            # No checksum given, so the published installer is downloaded and
            # hashed. The package then cannot record a checksum the published
            # file does not have.
            ./build/windows/build-chocolatey-package.ps1 -Version $env:VERSION `
              -InstallerSource $source -OutputDir chocolatey-package
          }
          else {
            # Nothing is published for a pull request, so this packages an
            # obviously fake checksum. It proves the templates render and that
            # choco pack accepts the result; it is not pushable, and the job
            # does not upload it.
            Write-Host '::notice::Packaging with a placeholder checksum; this run cannot push.'
            ./build/windows/build-chocolatey-package.ps1 -Version $env:VERSION `
              -Sha256 ('DEADBEEF' * 8) -InstallerSource $source -OutputDir chocolatey-package
          }

      - name: Check the packed package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build/windows/chocolatey/test-chocolatey-package.ps1 `
            -Package "chocolatey-package/thrift.$env:VERSION.nupkg"

      - name: Archive the package
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chocolatey-package
          if-no-files-found: error
          path: chocolatey-package/*.nupkg
          retention-days: 14

  push:
    name: Push to Chocolatey
    needs: package
    # A manual run is how a release gets pushed once the archive has the
    # installer, or from the GitHub release, so it pushes too.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chocolatey-package
          path: chocolatey-package

      - name: Push
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          $package = "chocolatey-package/thrift.$env:VERSION.nupkg"

          if (-not $env:CHOCO_API_KEY) {
            # The package is built and attached to the run either way.
            Write-Host '::warning::CHOCO_API_KEY is not set, so nothing was pushed to Chocolatey.'
            @(
              '### Chocolatey push skipped',
              '',
              'The `CHOCO_API_KEY` secret is not set, so the package was built but not',
              'pushed. It is attached to this run as the `chocolatey-package` artifact.',
              '',
              'The key has to belong to an account that maintains the `thrift` package on',
              'the Chocolatey community repository. See `doc/ReleaseManagement.md`.'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          choco push $package --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
