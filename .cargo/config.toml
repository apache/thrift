# Every Cargo build in this tree prefers the newest dependency versions that
# are compatible with the Rust version in effect, instead of failing when a
# dependency raises its minimum Rust version. That version is the crates'
# package.rust-version where one is set, and otherwise the running rustc,
# i.e. the toolchain pinned in rust-toolchain.
# Applies to builds from this checkout only; it is not part of the published
# crate.
[resolver]
incompatible-rust-versions = "fallback"
